<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aegis 投研 — 新易盛 (300502.SZ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* Near-black, cool-tinted */
    --bg:       oklch(0.155 0.012 255);
    --bg-elev:  oklch(0.185 0.013 255);
    --surface:  oklch(0.205 0.014 255);
    --surface-2: oklch(0.235 0.015 255);
    --hairline: oklch(0.28 0.015 255 / 0.7);
    --hairline-strong: oklch(0.34 0.018 255 / 0.9);

    --text:     oklch(0.94 0.005 255);
    --text-2:   oklch(0.72 0.008 255);
    --text-3:   oklch(0.54 0.009 255);
    --text-4:   oklch(0.40 0.010 255);

    /* Muted, low-sat accents */
    --accent:     oklch(0.72 0.075 210);   /* cool teal-slate */
    --accent-dim: oklch(0.52 0.055 210);
    --accent-bg:  oklch(0.28 0.04 210 / 0.35);

    /* Default (US / global): green = up, red = down */
    --up:        oklch(0.72 0.13 155);
    --up-soft:   oklch(0.30 0.06 155 / 0.55);
    --down:      oklch(0.68 0.17 25);
    --down-soft: oklch(0.30 0.08 25 / 0.55);
    --warn:      oklch(0.78 0.12 72);
    --warn-soft: oklch(0.28 0.06 72 / 0.50);

    --serif: "Source Serif 4", "Songti SC", "Noto Serif SC", Georgia, serif;
    --sans:  "Inter", "PingFang SC", "HarmonyOS Sans SC", system-ui, -apple-system, sans-serif;
    --mono:  "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* A-share override: red = up, green = down (China convention) */
  body[data-market="CN"] {
    --up:        oklch(0.68 0.17 25);
    --up-soft:   oklch(0.30 0.08 25 / 0.55);
    --down:      oklch(0.72 0.13 155);
    --down-soft: oklch(0.30 0.06 155 / 0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "cv11","ss01","ss03"; }
  a { color: inherit; text-decoration: none; }

  /* Scroll progress hairline */
  #scroll-progress { position: fixed; top:0; left:0; height:1px; background: var(--accent); z-index:100; width:0; transition: width 60ms linear; }

  /* Top bar */
  .topbar { position: sticky; top:0; z-index:40; height: 52px; display:flex; align-items:center; padding: 0 28px; background: color-mix(in oklab, var(--bg) 85%, transparent); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); border-bottom: 1px solid var(--hairline); }
  .topbar .brand { font-family: var(--serif); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .topbar .brand .dim { color: var(--text-3); font-weight: 400; margin-left: 10px; }
  .topbar .path { color: var(--text-3); font-size: 13px; margin-left: 20px; }
  .topbar .right { margin-left: auto; display:flex; align-items:center; gap: 18px; font-size: 12.5px; color: var(--text-3); }
  .kbd { font-family: var(--mono); font-size: 11px; color: var(--text-3); border:1px solid var(--hairline); padding: 2px 6px; border-radius: 4px; background: var(--bg-elev); }

  /* Layout grid */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) 280px; gap: 0; max-width: 1440px; margin: 0 auto; padding: 0 28px; }
  .toc { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); padding: 36px 20px 24px 0; overflow-y: auto; border-right: 1px solid var(--hairline); }
  .toc::-webkit-scrollbar { width: 6px; } .toc::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
  .main { padding: 36px 56px 160px; min-width: 0; }
  .rail { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); padding: 36px 0 24px 24px; overflow-y: auto; border-left: 1px solid var(--hairline); }
  .rail::-webkit-scrollbar { width: 6px; } .rail::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }

  @media (max-width: 1200px) { .layout { grid-template-columns: 240px 1fr; } .rail { display: none; } }
  @media (max-width: 900px)  {
    .layout { grid-template-columns: 1fr; padding: 0 20px; }
    .toc { display:none; }
    .main { padding: 24px 0 120px; }
    /* Stack 2-col grids at mobile width */
    .thesis-grid, .agent-points, .scen-grid { grid-template-columns: 1fr !important; }
    /* Top-right dock buttons would overflow at 320px — shrink gaps */
    .dock { right: 12px; bottom: 12px; font-size: 11.5px; }
    /* Stat-strip auto-fit already collapses; no change needed */
  }

  /* Print: light theme, hide floating UI chrome */
  @media print {
    html, body { background: white !important; color: #0a0a0a !important; font-size: 11pt; }
    .dock, .tweaks, #scroll-progress, .toc { display: none !important; }
    .layout { grid-template-columns: 1fr !important; padding: 0 !important; }
    .main { padding: 0 !important; max-width: 100% !important; }
    .topbar { position: static !important; border-bottom: 1px solid #bbb !important; background: white !important; }
    section { break-inside: avoid; page-break-inside: avoid; }
    .scen-cell, .stat, .agent, table, .callout { break-inside: avoid; page-break-inside: avoid; }
    .hero, .verdict, .scen-grid, .agent, .callout, .barlist, table.heat {
      border-color: #ccc !important; background: white !important; color: #0a0a0a !important;
    }
    a { color: #0a0a0a !important; text-decoration: none !important; }
    /* Keep semantic colors for up/down numbers */
    .up, .price-change.up, .v.up, .word.buy { color: #0a7e4a !important; }
    .down, .price-change.down, .v.down, .word.avoid { color: #c2302e !important; }
    .warn, .word.hold { color: #a05c00 !important; }
  }

  /* TOC */
  .toc-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-4); margin: 18px 0 10px; font-weight: 500; }
  .toc a { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px 6px 10px; border-radius: 6px; color: var(--text-3); font-size: 13.5px; line-height: 1.35; border-left: 1px solid transparent; margin-left: -1px; transition: color .15s, background .15s, border-color .15s; }
  .toc a .num { font-family: var(--mono); font-size: 11px; color: var(--text-4); min-width: 22px; }
  .toc a:hover { color: var(--text); background: color-mix(in oklab, var(--surface) 40%, transparent); }
  .toc a.active { color: var(--text); border-left-color: var(--accent); background: color-mix(in oklab, var(--accent-bg) 40%, transparent); }
  .toc a.active .num { color: var(--accent); }
  .toc .meta { font-size: 11.5px; color: var(--text-4); line-height: 1.5; padding: 0 10px; }

  /* Typography */
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; color: var(--text); letter-spacing: -0.015em; text-wrap: pretty; }
  .h-display { font-family: var(--serif); font-size: 44px; line-height: 1.08; font-weight: 500; letter-spacing: -0.022em; }
  .h-section { font-family: var(--serif); font-size: 30px; line-height: 1.15; font-weight: 500; letter-spacing: -0.018em; margin: 0 0 6px; }
  .h-sub { font-family: var(--serif); font-size: 20px; line-height: 1.25; font-weight: 500; letter-spacing: -0.012em; margin: 0 0 6px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-4); }
  .lede { font-family: var(--serif); font-size: 19px; line-height: 1.55; color: var(--text-2); font-weight: 300; }
  p { color: var(--text-2); margin: 0 0 14px; font-size: 15px; line-height: 1.72; }
  .prose p { font-family: var(--serif); font-size: 16.5px; line-height: 1.78; color: var(--text); font-weight: 300; }
  .prose p strong { font-weight: 500; color: var(--text); }
  .num, .mono, .tabular { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* Section spacing */
  section { margin-top: 96px; scroll-margin-top: 72px; }
  section:first-of-type { margin-top: 0; }
  .section-head { display:flex; align-items: baseline; gap: 14px; margin-bottom: 28px; padding-bottom: 16px; }
  .section-head .idx { font-family: var(--mono); font-size: 11px; color: var(--text-4); letter-spacing: 0.14em; }

  /* Header region */
  .hero { padding: 56px 0 40px; }
  .ticker-row { display:flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .ticker-mark { width: 44px; height: 44px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-bg), transparent); border: 1px solid var(--hairline-strong); display:flex; align-items:center; justify-content:center; font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--accent); }
  .ticker-meta { display:flex; flex-direction: column; gap: 2px; }
  .ticker-meta .code { font-family: var(--mono); font-size: 12.5px; color: var(--text-3); letter-spacing: 0.04em; }
  .ticker-meta .code .dot { margin: 0 6px; color: var(--text-4); }

  .price-row { display:flex; align-items: baseline; gap: 22px; margin-top: 10px; }
  .price { font-family: var(--mono); font-size: 40px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .price .curr { font-size: 20px; color: var(--text-3); margin-right: 6px; font-weight: 400; }
  .price-change { font-family: var(--mono); font-size: 15px; padding: 3px 10px; border-radius: 4px; }
  .price-change.up { color: var(--up); background: var(--up-soft); }
  .price-change.down { color: var(--down); background: var(--down-soft); }
  .price-meta { color: var(--text-3); font-size: 12.5px; }

  .stale-banner { margin-top: 28px; display: flex; align-items:flex-start; gap: 14px; padding: 14px 18px; border: 1px solid color-mix(in oklab, var(--warn) 30%, transparent); background: var(--warn-soft); border-radius: 8px; }
  .stale-banner .icon { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--warn); color: var(--warn); display:flex; align-items:center; justify-content:center; font-size: 11px; font-family: var(--mono); font-weight: 600; flex-shrink: 0; margin-top: 1px; }
  .stale-banner .title { color: var(--warn); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .stale-banner .body { font-size: 13px; color: var(--text-2); line-height: 1.55; }

  /* Quick stats strip */
  /* Auto-fit grid so the border-right trim lands cleanly whether the
     pipeline emits 3, 4, or 5 quick tiles. */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; margin-top: 34px; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  .stat { padding: 18px 20px 18px 0; border-right: 1px solid var(--hairline); }
  .stat:last-child { border-right: none; }
  .stat:last-child { border-right: none; padding-right: 0; }
  .stat .lbl { font-size: 11.5px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .stat .val { font-family: var(--mono); font-size: 22px; color: var(--text); letter-spacing: -0.01em; }
  .stat .sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

  /* Lede card (recommendation band) */
  .verdict { margin-top: 36px; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; padding: 24px 28px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; }
  .verdict .rating { display:flex; flex-direction: column; align-items: center; gap: 4px; padding-right: 28px; border-right: 1px solid var(--hairline); }
  .verdict .rating .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-4); }
  /* Rating word semantics (both markets):
     buy/overweight → bullish  (--up, green in US / red in CN)
     hold/neutral   → caution  (--warn, amber)
     avoid/reduce   → bearish  (--down, red in US / green in CN) */
  .verdict .rating .word { font-family: var(--serif); font-size: 26px; color: var(--up); font-weight: 500; letter-spacing: -0.01em; }
  .verdict .rating .word.buy   { color: var(--up); }
  .verdict .rating .word.hold  { color: var(--warn); }
  .verdict .rating .word.avoid { color: var(--down); }
  .verdict .tgt { display:flex; flex-direction: column; gap: 3px; }
  .verdict .tgt .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-4); font-family: var(--mono); }
  .verdict .tgt .val { font-family: var(--mono); font-size: 22px; color: var(--text); }
  .verdict .spread { font-family: var(--mono); font-size: 13px; color: var(--up); }

  /* Prose */
  .reading { max-width: 720px; }
  .reading.wide { max-width: 820px; }

  /* Pull quote */
  .pullquote { font-family: var(--serif); font-size: 22px; line-height: 1.5; color: var(--text); padding: 4px 0 4px 24px; border-left: 1px solid var(--accent); margin: 28px 0; font-weight: 300; letter-spacing: -0.012em; }
  .pullquote .attrib { display:block; margin-top: 10px; font-size: 12px; color: var(--text-4); font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }

  /* Scenario card */
  .scen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
  .scen-cell { background: var(--bg-elev); padding: 22px 22px 24px; position: relative; }
  .scen-cell .hd { display:flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .scen-cell .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-4); }
  .scen-cell .prob { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .scen-cell .px { font-family: var(--mono); font-size: 32px; font-weight: 500; letter-spacing: -0.015em; margin-bottom: 2px; }
  .scen-cell.bear .px { color: var(--down); }
  .scen-cell.base .px { color: var(--text); }
  .scen-cell.bull .px { color: var(--up); }
  .scen-cell .delta { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-bottom: 14px; }
  .scen-cell p { font-family: var(--serif); font-size: 14px; line-height: 1.65; color: var(--text-2); font-weight: 300; margin: 0; }

  /* Probability bar under scenarios */
  .prob-bar { display:flex; height: 3px; margin-top: 18px; border-radius: 2px; overflow: hidden; background: var(--surface-2); }
  .prob-bar .seg { height: 100%; }
  .prob-bar .seg.bear { background: var(--down); }
  .prob-bar .seg.base { background: var(--accent); }
  .prob-bar .seg.bull { background: var(--up); }
  .prob-legend { display:flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--text-4); margin-top: 8px; letter-spacing: 0.06em; }

  /* Weighted line */
  .weighted { margin-top: 28px; display:flex; align-items: baseline; gap: 18px; padding: 20px 24px; background: color-mix(in oklab, var(--surface) 55%, transparent); border: 1px solid var(--hairline); border-radius: 8px; }
  .weighted .k { font-size: 12px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--mono); }
  .weighted .v { font-family: var(--mono); font-size: 26px; color: var(--text); }
  .weighted .delta { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--up); }

  /* Tables */
  table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.data th, table.data td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--hairline); }
  table.data th { font-weight: 500; color: var(--text-4); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--hairline-strong); }
  table.data td.num, table.data th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table.data tr:hover td { background: color-mix(in oklab, var(--surface) 30%, transparent); }
  table.data tr.total td { border-top: 1px solid var(--hairline-strong); font-weight: 500; color: var(--text); }

  /* Sensitivity heatmap */
  table.heat { width:100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  table.heat th, table.heat td { padding: 8px 10px; text-align: right; border: 1px solid var(--hairline); }
  table.heat th { font-size: 11px; color: var(--text-4); font-weight: 500; background: var(--surface); }
  table.heat td.rh { text-align: left; color: var(--text-3); background: var(--surface); }
  table.heat td.hot { position: relative; }

  /* Agent cards */
  .agent-list { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .agent { padding: 22px 24px; background: var(--bg-elev); border: 1px solid var(--hairline); border-radius: 10px; transition: border-color .2s, background .2s; }
  .agent:hover { border-color: var(--hairline-strong); }
  .agent .hd { display:flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .agent .role { font-family: var(--mono); font-size: 11px; color: var(--text-4); letter-spacing: 0.14em; text-transform: uppercase; min-width: 110px; }
  .agent .name { font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; flex: 1; }
  .agent .stance { font-family: var(--mono); font-size: 11.5px; padding: 3px 9px; border-radius: 3px; letter-spacing: 0.06em; }
  .agent .stance.bear { color: var(--down); background: var(--down-soft); }
  .agent .stance.bull { color: var(--up); background: var(--up-soft); }
  .agent .stance.neutral { color: var(--warn); background: var(--warn-soft); }
  .agent .thesis { font-family: var(--serif); font-size: 15.5px; line-height: 1.72; color: var(--text-2); margin-bottom: 14px; font-weight: 300; }
  .agent .thesis strong { color: var(--text); font-weight: 500; }
  .agent-points { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .agent-points .col h5 { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-4); font-weight: 500; margin: 0 0 8px; }
  .agent-points ul { margin: 0; padding: 0; list-style: none; }
  .agent-points li { font-size: 13px; color: var(--text-2); line-height: 1.55; padding-left: 14px; position: relative; margin-bottom: 8px; }
  .agent-points li::before { content: ""; position: absolute; left: 0; top: 9px; width: 4px; height: 1px; background: var(--text-4); }

  /* Rail side-note */
  .rail-block { margin-bottom: 32px; }
  .rail-block .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-4); margin-bottom: 10px; }
  .rail-kv { display:flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .rail-kv:last-child { border-bottom: none; }
  .rail-kv .k { color: var(--text-3); }
  .rail-kv .v { font-family: var(--mono); color: var(--text); }
  .rail-kv .v.up { color: var(--up); }
  .rail-kv .v.down { color: var(--down); }

  .critic-row { display:flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12px; }
  .critic-row .cn { flex: 1; color: var(--text-3); }
  .critic-row .cc { font-family: var(--mono); font-size: 11.5px; color: var(--text-4); }
  /* Status dots use absolute colors — green = ok, red = err — irrespective
     of market convention. (They're UI/system semantics, not up/down P&L.) */
  .critic-row .dot { width: 6px; height: 6px; border-radius: 50%; }
  .critic-row .dot.ok   { background: oklch(0.72 0.13 155); }
  .critic-row .dot.warn { background: var(--warn); }
  .critic-row .dot.err  { background: oklch(0.68 0.17 25); }

  /* Callouts */
  .callout { margin: 22px 0; padding: 18px 22px; background: color-mix(in oklab, var(--accent-bg) 28%, transparent); border-left: 1px solid var(--accent); border-radius: 0 6px 6px 0; font-family: var(--serif); font-size: 15.5px; line-height: 1.7; color: var(--text); font-weight: 300; }
  .callout strong { font-weight: 500; }

  /* Thesis panel */
  .thesis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 48px; margin-top: 8px; }
  .thesis-item { border-top: 1px solid var(--hairline); padding-top: 18px; }

08-25披露）显示：境外收入占比从FY2025的96.2%进一步升至97.9%，光互联产品毛利率从FY2025的47.8%改善至48.5%；两项指标同向改善，边际产品竞争力未见侵蚀"], "cons": ["经营现金流/净利润0.808与应计项目比率0.071，在187%营收增速的高成长期属于正常范围，不应被解读为盈利质量缺陷：任何快速成长的制造业公司都必须预建存货与应收账款，FY2025的18.3亿元营运资本净投入恰与营收从¥86.5亿到¥248.4亿的¥161.9亿扩张规模相匹配——营运资本占用是成", "96%境外收入的主要客户为全球头部超大规模数据中心运营商（前五大客户合计占比72.34%，第一大客户22.97%），该类客户信用质量极高、经营现金流充裕，65天DSO实质上是T/T或远期信用证结算条款下的正常周期；实际信用损失风险极低，将DSO与国内应收账款回款风险等量齐观是单点过拟合"], "narrative": "新易盛会计质量深度备忘录（2026-08-28，会计分析师内部）\n\n**一、盈利质量总体判断**\n\n以FY2025年报为基础，新易盛的盈利质量呈现\"账面优秀、现金折价\"的典型高速成长期格局。经营现金流/净利润0.808意味着约¥18亿的账面利润以应收账款（¥44.4亿）与存货（¥72.3亿）形式锁定在供应链中，导致自由现金流¥63.8亿仅为净利润¥95.3亿的约67%。这一折损幅度本身在187%营收增速下可以理解，但它揭示了一个市场定价中普遍存在的隐性假设：当前¥5703亿市值所隐含的20.7%长期增速路径，是以净利润全额转化为现金为前提的。若FCF转化率长期维持在67%，则实际股东回报路径将系统性弱于净利润增长所暗示的路径。\n\n**二、FCF压缩风险的前瞻量化**\n\n机构预期FY2026全年营收¥522.7亿，约为FY2025的2.1倍。若NWC（营运资本）强度维持在FY2025水平，净营运资本需求将随营收近乎翻倍，同步消耗大量增量经营现金流。加之资本支出在产能扩张期可能不会同比例收窄（FY2025资本支出/营收5.31%，若同步增长则资本支出需求大幅上升），FCF/净利润比率向50%收窄的风险是本分析认为最被市场低估的会计层面隐患。这一风险不会在利润表上显现，只会在经营现金流与FCF数据中体现——而当前市场定价框架以净利润为主轴，可能在全年FCF低预期时触发情绪层面的负面反馈。\n\n**三、H1 2026半年报关键信号解读**\n\n2026-08-25披露的半年报带来两个重要正面信号：境外收入占比从96.2%升至97.9%（集中度进一步提升，双刃剑），光互联产品毛利率从47.8%改善至48.5%。毛利率边际改善是当前最有价值的盈利质量信号：若利润率纯属供需周期溢价，随竞争对手产能爬坡初期即应走平或下行，而数据显示相反。这初步支持\"产品组合向高端迁移存在结构性成分\"的假说，但单一半年期不构成确论。\n\n然而，本分析最关注的数据点——H1 2026应收账款账龄结构——尚未从当前提供的数据集中确认。FY2025 DSO约65天，对96%境外头部科技客户而言处于正常区间。若H1 2026 DSO拉伸至80天以上，则意味着客户延期付款或公司为冲营收提前确认，这是最明确的盈利质量恶化早期信号，应当作为最优先的跟进核实项。\n\n**四、税率结构——被低估的净利润下行风险**\n\n实际有效税率12.1%是本分析最值得深挖的异常点。12.1%低于高新技术企业15%优惠税率约3pp，在数学上可由研发费加计扣除解释，但额度精确匹配需核实具体税务申报数据。更重要的是税率路径的脆弱性：高新技术企业资质每三年复审一次，若复审失败（研发投入比例下降、专利结构不达标）或研发活动因业务扩张而部分海外化，有效税率将在单季度内向15%乃至更高跳升。该事件不会伴随任何业务基本面前置信号，但将对净利润产生2-15pp的非线性压缩。当前¥5703亿市值下，有效税率每提升1pp对净利润影响约¥1.1亿——与当前每季度业绩预期误差相当，足以触发情绪层面的超额反应。\n\n**五、股权激励：稀释规模与业绩能见度的双重含义**\n\n2024年计划预留授予第二期归属成就（2026-08-25公告）与2026年新激励计划草案（2026-08-21披露）的同期叠加，使稀释压力从当前可忽略水平（约0.42%）进入值得关注区间。更关键的分析维度是：新激励计划草案的业绩归属条件是管理层对FY2026-2027增长能见度最具约束力的硬性公开承诺。草案条件若明显低于机构预期的¥522亿/¥197.6亿，即传递悲观信号；若接近或超过机构预期，则是管理层置信度的正向佐证。这一信息是本分析最优先的跟进核实项目之一。\n\n**六、CAS会计准则特殊项目**\n\n2026-08-25同日披露的\"2026年半年度非经营性资金占用及其他关联资金往来情况汇总表\"，按监管要求是强制信披项目，本身不构成红旗，但金额需核实是否超过净资产5%的实质性门槛。财务费用净收入-¥3.18亿主要反映¥81.6亿净现金产生的利息收入，属正常经常性项目。政府补贴是否通过\"其他收益\"科目渗入运营利润，是CAS口径下43.7%运营利润率含金量的关键变量，当前数据集未能直接量化。\n\n**综合评级**：盈利质量B+。正面：净现金资产负债表消除财务危机风险，ROIC 86.6%、H1 2026毛利率边际改善。折价：FCF/净利润67%且FY2026将进一步压缩，税率12.1%可持续性存疑，H1 2026应收账款账龄待核实。当前盈利质量尚不构成投资否决理由，但FCF转化率与税率路径是FY2026最值得持续量化监控的两个锚点。", "fallback": false}, {"role": "业务分析师", "name": "产能利用率与资产错配", "stance": "bear", "score": 3.0, "thesis": "研发强度2.8%与47.8%毛利率的结构性张力，支持「周期性供需溢价」假说而非「技术壁垒型护城河」假说。若公司具备可持续的专利型或工艺型壁垒，理性的资本配置应显著加大研发投入以锁固壁垒；2.8%的低密度更符合「供给缺口期享有临时定价权」的解释——当前高利润率主要来自AI算力军备竞赛下的供需极度失衡，而非难以复制的技术护城河。随着国内竞争对手产能爬坡追近，这一溢价存在系统性收窄风险。", "pros": ["光互联产品贡献¥247.7亿营收（占比99.7%），毛利率47.8%；2026年上半年该品类占比进一步升至99.9%，毛利率微升至48.5%。单一产品极端集中意味着公司无任何横向缓冲——产品周期切换、技术规格迭代或需求端突变将以100%乘数传导至利润表，而产品多元化的分散保护实际上不存在。", "境外收入¥238.9亿（占比96.2%，毛利率48.4%）；境内收入¥9.5亿（占比3.8%，毛利率34.0%），境内外毛利率差距达14.4个百分点。2026年上半年境内毛利率大幅改善至43.2%（较FY2025全年+9.2pp），境内收入收窄至¥4.3亿（占比2.1%）。境内外毛利率的悬殊差距是判"], "cons": ["设计定点与认证壁垒是可量化的短期实质性进入门槛，不能被简单归结为「临时保护」。北美超大规模数据中心客户在部署大规模光互联产品前，通常经历6-12个月的产品资格认证（PQ）和设计验证测试（DVT）。新易盛已在最苛刻的买家处完成认证并达成72.34%的前五客户集中度，这本身就是「交付能力+产品质量+良率", "2.8%的研发投入强度在光模块行业的系统集成商定位下并非异常低。光模块核心器件（DSP芯片、激光器）的研发主要由上游器件供应商承担，整机厂商的竞争力集中在封装工艺、热管理、良率工程和供应链整合，这些能力更多沉淀在工程人员和生产线中而非研发账目。在光模块走向系统集成的成熟阶段，将「研发密度低」直接等同"], "narrative": "\n## 业务质量备忘录：新易盛（300502）商业引擎深度评估\n\n**核心命题的重新表述**\n\n研究指令将核心争议框架为「技术壁垒 vs 周期性溢价」的二元选择，但更精确的分析框架应是：「壁垒的时间维度」——不是有没有壁垒，而是壁垒能持续多久。\n\n**营收驱动树**\n\n新易盛的营收引擎高度单线条：\n- 总营收（¥248.4亿）= 境外营收（¥238.9亿，96.2%）+ 境内营收（¥9.5亿，3.8%）\n- 境外核心驱动链：北美/亚太超大规模数据中心AI资本开支强度 → 光互联模块需求量（随服务器密度扩张）× 速率代际ASP阶梯（400G→800G单价约2-3倍升幅）× 新易盛在主要客户的份额（认证准入决定）\n- 当前增长源头：AI CapEx超级周期（近端量的驱动）+ 速率代际切换（800G放量带来价的驱动）+ 认证完成后份额扩张的乘数效应\n- 境内驱动链规模极小，毛利率34%显示国内定价权受制于本土竞争，短期内对总营收的边际影响可忽略\n\n**壁垒时间窗口分析**\n\n认证壁垒是可量化的短期护城河：超大规模数据中心引入新供应商通常需要6-12个月资格认证（PQ）和3-6个月设计验证（DVT），合计约12-18个月。新易盛已在前五大客户处完成认证，竞争对手即使技术追平也需重走全流程。这意味着存在约12-18个月的「排他性窗口」，对应2026-2027年的增长路径在认证层面有结构性保护。\n\n但窗口之后的竞争格局判断是估值的核心变量。当前2.8%的研发密度在47.8%毛利率下形成明显张力——若技术护城河源于专利保护或难以复制的核心知识产权，企业有动机以更高研发投入强化壁垒；低研发密度更符合「工程积累型良率优势」的解释，而这类优势随竞争对手时间积累而逐渐可复制。\n\n**境内¥9.5亿的战略价值重估**\n\n境内市场通常被讨论为「地缘政治缓冲」，但这个逻辑在数字层面站不住脚：境内收入不足境外的4%，且毛利率低14pp，即使境内收入翻倍，对境外断供冲击的对冲系数接近于零。\n\n然而2026H1境内毛利率从34.0%跳升至43.2%（+9.2pp）提示一个更有价值的战略读法：境内客户正在消化更高规格产品（可能是800G开始在国内AI数据中心落地），产品结构升级在境内先于规模体现。若国内AI基础设施资本开支在2027-2028年加速，境内市场可能从「战略次要市场」转型为「增量来源」，同时带动整体毛利率进一步改善。这是一个低概率但值得跟踪的正向期权。\n\n**H2兑现是当前的最高优先级验证节点**\n\n半年报披露截止日为2026-08-31（3天内），机构预期H2净利润贡献约¥117-128亿将成为首个可交叉验证的数据点。从产业逻辑看，H2加速的前提是境外大客户在下半年持续放量（800G批量采购进入收割期），这与AI数据中心建设的季节性节奏一致（北美云厂商通常Q3-Q4加速交付）。若H2实际值低于¥100亿，机构2026E全年预期将承受大幅下修压力。\n\n**估值缺口的结构性解释**\n\n现价¥409.10与概率加权DCF价值¥154.49之间约2.65倍的缺口，只能被解释为市场为「期权价值」支付了显著溢价：即市场押注机构高速增长路径的实现概率远高于DCF所内含的假设。这在AI主题超级周期内是可观察到的定价模式，但需要警惕「期权定价模式→盈利定价模式」的切换条件：一旦收入增速连续两个季度低于预期或利润率系统性下移，EV/EBITDA约50倍和P/E约60倍将同步面临均值回归，届时「增速下调×倍数压缩」的双重压缩将产生非线性价格冲击，而96%境外集中度意味着任何地缘政治突发事件都可以成为这一切换的触发点。\n\n**结论性判断**\n\n新易盛的商业引擎在认证窗口期内（约12-18个月）具有真实的、可量化的竞争保护；其轻资产模式（ROIC 86.6%）和净现金资产负债表（¥81.6亿）是高质量财务特征。核心不确定性不在于2026年能否兑现，而在于2027-2028年认证壁垒被竞争对手突破后利润率将落在哪个区间——若均值回归至25-35%的行业正常区间，现价所需隐含增速门槛将大幅跳升，现有估值框架的承载力将被系统性挑战。\n", "fallback": false}, {"role": "管理层分析师", "name": "资本配置与战略纪律", "stance": "bear", "score": 2.8, "thesis": "管理层资本配置的量化记录（ROIC 86.6%）有充分数据支撑，但资本结构极度保守（零有息负债、¥81.6亿现金闲置）。在ROIC大幅超越WACC的阶段，最优资本配置应优先有机再投资，其次回购或特别分红；当前选择持有巨额现金而非加速产能投入或提高分红，暗示管理层可能预留了尚未公开的战略用途（如并购），或对未来需求节奏持内部保守态度——后一种解读与激励计划草案的出发点存在张力，值得追踪H2产能扩张实际动作。", "pros": ["ROIC 86.6% 与近乎零债务（总债务¥0.04亿，净现金¥81.6亿）并存：公司选择以内生现金流支撑扩张，未使用任何有息杠杆。在ROIC远超WACC约9.5%的背景下，这是保守而非效率最优的资本配置姿态——¥81.6亿现金仍处于闲置状态，并未以再投资、分红或回购形式回馈股东。", "2026-08-25公告显示2024年限制性股票激励计划预留授予第二期归属条件已成就。这意味着FY2024-2025的内部业绩考核目标已被满足或超越，与FY2025营收¥248.4亿（同比+187.3%）及归母净利润¥95.3亿的实际兑现相吻合。前期激励计划未出现目标倒退或延期的信号。"], "cons": ["反驳「ROIC 86.6% = 管理层卓越」：86.6%的ROIC在任何行业、任何时期都属于极端值，接近理论上限。AI算力军备竞赛下，光互联产品极度供不应求，具有定价权的供应商可以在不优化运营效率的前提下实现极高回报——这是周期性供需失衡的产物，而非管理能力的单一体现。历史上类似的极端ROIC（如2", "反驳「新激励计划代表利益充分绑定」：2026年股权激励计划在股价¥409历史高点附近推出，若授予价格存在折扣且业绩门槛设置偏低（低于机构一致预期¥197.57亿），激励对象实际上在股价显著跑输市场的情境下仍可归属——即内部人员无需为外部股东创造增量价值即可受益。在具体业绩考核数字公开前，不能排除「高"], "narrative": "", "fallback": false}, {"role": "估值分析师", "name": "DCF 与多组估值三角", "stance": "bear", "score": 3.2, "thesis": "终值权重主导（57.7%）叠加WACC最高敏感性（12.9%）共同揭示：现价¥409.10本质上是对「新易盛能否在AI资本开支超级周期结束后，凭技术护城河在终态仍维持35%+运营利润率」的长期定价——这是一个结构性护城河判断，而非近端两年的业绩预测问题。若利润率被证明是周期性溢价而非结构性壁垒，终值将大幅缩水，WACC的杠杆效应将使影响非线性放大。", "pros": ["现价¥409.10较DCF概率加权价值¥154.49溢价约2.65倍，即便牛市情景估值¥204.37亦仅为现价的50%，三情景（熊¥106.08/基¥159.06/牛¥204.37）全部低于现价，现价已超越所有内在价值情景上限。", "在43.7%运营利润率不变的前提下，¥409.10现价隐含约20.7%的年营收永续增速（WACC±1%区间：18.0%-23.2%）；而机构共识2026E营收¥522.66亿、2027E营收¥888.18亿、2028E营收¥1311.67亿，对应2026E/2027E营收同比增速约为110.4%和6"], "cons": ["机构路径隐含估值并不荒唐：若2026E净利润¥197.57亿兑现（H1预告¥70-80亿已部分验证），2026E前瞻市盈率约23.9倍、2027E约14.1倍，对于一家年增速110%、ROIC 86.6%、零债务的AI基础设施核心受益标的，此倍数区间在全球可比公司中属合理定价。现价的「高估」判断建立", "ROIC 86.6%叠加零负债的复利能力被DCF系统性低估：传统DCF假设资本再投资回报等于WACC（9.5%），但若新易盛实际ROIC长期维持在50%+，再投资带来的超额回报将大幅高于折现率，DCF模型隐含地对这一超额回报进行了折损。资产轻、FCF丰、无杠杆的结构意味着公司可以用¥63.8亿年度自"], "narrative": "**估值分析师备忘（内部）：新易盛（300502）——2.65倍缺口的结构性解构**\n\n*核心结论先行：现价¥409.10无法由任何单一内在价值框架支撑，但若机构共识路径精确兑现，其前瞻倍数并非荒唐；风险不在于「贵不贵」，而在于这条路径对利润率维持的脆弱性依赖，以及市场微观结构（筹码扩散+两融退潮）已经在发出警示信号。*\n\n**为何DCF与市场价格差这么大？终值权重是关键**\n\nDCF基础价值¥159.06与市价¥409.10的差距，根本原因并非增速假设保守，而是DCF框架的结构性局限：5年高速增长期结束后强制收敛至永续3%增速，而市场定价实际上是在为「高速增长期比5年更长」这一隐含期权付费。从DCF桥接数据看，终值现值占企业价值约57.7%，高速阶段自由现金流约42.3%——这意味着即便完全相信机构的¥522→¥888→¥1312亿路径，超过一半的估值仍依赖于「终态护城河能否持续」这一非常长期的假设。WACC敏感性高达12.9%（优于利润率敏感性9.85%和增速敏感性6.1%），进一步印证：折现率对终值的放大效应远超近端增速变化的影响——现价买家实际上在为一个极长久期的现金流故事定价。\n\n**利润率才是真正的断点，而非增速**\n\n本次分析的最重要发现：敏感性排名中，利润率（9.85%/pp）是增速（6.1%）的1.6倍。这意味着「利润率下滑5pp」对估值的破坏力，相当于「营收增速少8pp」的破坏力。更危险的是，利润率下滑与增速放缓在历史上高度共生——国内光模块行业2018-2021年的周期经历清晰展示了这一规律：当客户端产能追上需求时，均价下行、毛利率收窄和增速骤降几乎同步发生。若此次AI光互联需求的利润率（当前43.7%）是周期性溢价而非技术护城河，那么拐点到来时，利润率与增速将同步下滑，DCF双变量冲击将以乘法而非加法叠加，估值重估将是非线性的。FY2026H1的48.5%毛利率较FY2025全年47.8%小幅走扩，目前仍是多头最有力的近端数据支撑——但这只有一期数据，样本量不足以确认趋势。\n\n**共识路径的内部自洽性与外部脆弱性**\n\n机构共识若完全兑现，2026E/2027E前瞻市盈率将分别降至约23.9倍和14.1倍，EV/EBITDA将从约50倍压缩至约14倍（2027E），这在全球AI基础设施可比公司中并非极端。这是真实的「多头脚本」，不能简单否认。但该脚本要求两个条件同时成立：（1）18个月内营收从¥248.4亿跃升至¥888亿（2.5倍以上），且全程96%来自境外；（2）利润率在此高速增长期间完全不受竞争和价格压力侵蚀。历史上几乎没有一家中国制造商能同时满足「3年5倍规模扩张」和「利润率完全稳定」——前者需要快速铺货（可能包含低毛利订单）、供应商议价能力下降以及新进入者的定价竞争。H2 2026的利润率数据（3天后半年报披露）将是第一个高频验证节点。\n\n**市场微观结构：筹码信号不可忽视**\n\n股东户数在2025年H1仅约9.8万户，到2026H1已跳升至25.7万户，单期环比+65.33%；同期融资余额从高峰已下降15.15%。两者的组合——散户户数急剧扩张、杠杆资金同步撤退——是典型的「机构向散户转移筹码」微观结构特征，在高市值科技股的历史案例中，此信号出现在股价相对高位时，往往预示主力资金的阶段性减仓完成。当然，户数扩散也可能仅反映市场热度自然扩散，不能作为独立卖出依据。但在2.65倍估值溢价的背景下，这一信号使短期下行风险的概率权重值得适度上调。\n\n**分析框架局限性声明**\n\n本分析所用DCF参数（WACC 9.5%、终端增速3%）是标准化设定，未能捕捉新易盛在AI资本开支加速期可能享有的结构性超额ROIC。若公司ROIC能在更长周期内维持远超WACC的水平（当前86.6% vs WACC 9.5%），价值创造速度将系统性高于DCF预测。这是本报告最大的下行偏差风险，而「结构性壁垒 vs 周期性溢价」的核心争议正是要回答这个问题。", "fallback": false}, {"role": "风险分析师", "name": "客户集中度与偿付能力", "stance": "bear", "score": 3.4, "thesis": "产能约束不是阻断机构增长路径的主要风险因子，利润率压缩与折现率上行才是。DCF敏感性分析明确：capex_to_revenue对估值影响居末位（0.28%），而营业利润率（9.85%）与WACC（12.92%）是真正的估值杠杆。历史轻资产模式（非流动资产增速持续低于营收增速，2021-2025年四年成立）若能延续，¥81.6亿净现金加年度FCF在3年视野内具备覆盖增量资本开支的可行性。然而这一前提本身构成条件性风险：若规模化被迫推动向上游（芯片/晶圆/高端封装）延伸，capex强度将面临结构跳升，届时与会计分析师预警的营运资本扩张效应叠加，FCF压缩将非线性加速。首席分析师专项指向的「capex-to-revenue 5.3%是否支撑¥522亿→¥1312亿扩张」这一问题，模型层面答案是：在轻资产假设延续条件下暂无财务意义上的产能瓶颈，但若产业竞争格局迫使公司改变定位，该假设将失效且将与估值敏感性排名最高的利润率因子同向叠加恶化。", "pros": ["双重集中结构性暴露：FY2025光互联产品收入占比99.7%（¥247.7亿），境外收入占比96.2%（¥238.9亿），前五大客户合计72.34%（第一大客户22.97%）。FY2026H1分部数据（境外¥204.7亿，占97.9%；光互联产品¥208.8亿，占99.9%）显示三重集中度均未见收窄", "资本开支强度（capex-to-revenue）为5.31%，FY2025绝对额¥13.2亿。DCF敏感性分析显示capex_to_revenue对每股估值影响仅0.28%，在所有测试假设中排名最末——远低于营业利润率（9.85%）和WACC（12.92%）的影响量级。"], "cons": ["43.7%运营利润率若为光互联产品真实技术壁垒（良率积累、客户认证周期、交付速度），则历史上类似集中度光通信企业P/E压缩路径的可比性存在根本局限：彼类企业多为高杠杆结构，而新易盛净现金¥81.6亿、有息负债近零，破产风险几乎为零。净现金护城河赋予公司极强的等待能力与谈判筹码，即便订单出现阶段性中断", "AI超大规模数据中心在800G向1.6T迭代升级窗口中，倾向于维持少数认证供应商以保障供应链连续性——高客户集中度72.34%可能从风险因子转变为护城河信号：若被主要云厂商完成设计定点，则第一大客户22.97%的订单具有合同锁定性和稀缺替代性，与市场对「单点依赖」的担忧有本质区别。此外，2026年新"], "narrative": "", "fallback": false}, {"role": "变体分析师", "name": "市场共识与错价机制", "stance": "bear", "score": 3.0, "thesis": "现价¥409.10的变体本质是「市场对增速兑现、利润率维持、地缘政治零中断三者联合概率赋予了接近1.0的权重」。概率加权DCF价值¥154.49是在熊市概率30%、基准概率45%、牛市概率25%下计算的；而现价成立所要求的增速+利润率+集中度三条件同时成立的联合概率，远低于任何单一条件的概率。核心变体分歧不是「某一条件是否成立」，而是市场系统性高估了三条件联合实现的可行性。", "pros": ["现价¥409.10与DCF概率加权价值¥154.49之间存在约2.65倍溢价缺口，宏观预期前沿模型显示：维持当前43.7%营业利润率不变的前提下，现价需要约20.7%的年复合营收增速支撑至永续终态（WACC±1%区间：18.0%~23.2%）。这一增速门槛已超出绝大多数成熟行业的可持续终态上限。", "境外收入占比从FY2025的96.2%（¥238.9亿）进一步上升至H1 2026的97.9%（¥204.7亿），前五大客户集中度72.34%（第一大客户占比22.97%）。双重集中结构意味着：境内¥9.5亿收入（FY2025，毛利率34.0%）即便规模翻倍，其贡献占境外¥238.9亿营收的比例仍不"], "cons": ["17家机构覆盖、最新研报日期2026-08-26（距今2天），在充分知情H1业绩预告和半年报情况下，机构仍维持FY2026E归母净利润¥197.57亿、FY2027E ¥334.22亿的预测。以当前市值约5703亿对应FY2026E归母净利润¥197.57亿计算，FY2026E P/E约29倍——对", "从相对估值框架看，新易盛PE(TTM) 43.5倍处于通信设备同业第20分位（同业中位数114.1倍），市场实际上已对新易盛执行了显著折价——这与「绝对估值过高」的叙事形成直接矛盾。PB 23.48倍处于同业第60分位，反映的是ROE 52.8%支撑下合理的净资产溢价。若地缘政治风险是市场广泛共识，"], "narrative": "**变体定位与地缘政治定价盲区——高级分析师备忘录**\n\n**变体结构的本质解剖**\n\n新易盛的核心变体不是「业绩好不好」，而是「市场定价所要求的三条件联合概率是否现实」。当前¥409.10的成立条件，是在20.7%永续营收增速下利润率全程无损且96%境外集中度零中断兑现——三个条件同时成立的概率，远低于任何单一条件的概率。\n\n将¥250/股溢价缺口分层拆解：**增速驱动（ΔV_增速）**构成主体，市场采信2026E+110%/2027E+70%的近端超级周期路径，并将其折入终值基数，形成远高于基准DCF的近端自由现金流积累；**利润率稳定性（ΔV_利润率）**居次，敏感性数据显示每1pp利润率下滑约¥15.7/股，而43.7%到35%的系统性滑落将使估值压缩超50%；**行为叙事溢价（ΔV_行为）**构成剩余部分，是A股「最纯粹AI光互联标的」稀缺性溢价，也是叙事切换时缩水最快、最没有现金流锚的成分。\n\n**地缘政治风险的两条传导链与量化边界**\n\n本分析识别两条结构不同的冲击传导链，风险概率和破坏力各异：\n\n**上游组件管制链**：若美国商务部将光互联核心组件（激光芯片、高速驱动IC）纳入出口管制，限制向中国厂商供应，则99.7%单一产品结构意味着生产几乎全线停顿。关键未知变量是国产化率——若主要激光芯片已完成国产替代，此链路概率大幅下降；若仍依赖美国来源，这是低概率但接近全额营收破坏力的尾部风险。历史先例：华为2019年实体清单事件，6个月内关键产品线产能急降，库存蓄水仅能提供短期缓冲，此后进入18个月以上的国产替代周期。国产化率是本次分析最关键的数据盲区。\n\n**下游禁令链**：若美国限制其境内超大规模数据中心运营商采购中国产光互联产品，则境外¥238.9亿营收×72.34%大客户占比，意味着约¥172.8亿营收暴露于强制替换风险。传导速度：光模块是标准化消耗品（400G/800G规格），西方替代供应商（Coherent、Lumentum、Ciena等）存量产能可在12~18个月内部分填补，但短期内新易盛在手订单将形成明显缺口。此情景在当前市场定价中的隐含概率接近零——熊市价值¥106/股对应的是温和增速放缓+6pp利润率压缩，而非订单断供。这是最显著的定价盲区。\n\n**AI资本开支周期：传导速度与历史校验**\n\n光互联产品直接服务于AI训练集群的网络层互连，是超大规模资本开支的直接下游。传导机制极为快速：超大规模买家削减资本开支指引→采购订单压缩→光模块厂商出货下滑，通常1~2个季度内体现。2018年光通信周期提供了历史参照：云厂商建设节奏边际放缓，400G模块价格两个季度内下跌30~40%，头部供应商单季营收环比下滑20~25%。新易盛当前47.8%毛利率和43.7%营业利润率明显强于2018年行业均值，反映800G产品的技术稀缺性——但一旦竞争对手产能爬坡追上，价格弹性将快速显现。\n\n关键时间节点是2027年：机构预期¥888亿营收（+70%）要求超大规模客户继续以极高密度扩充AI训练集群，而历史上尚未出现连续三年资本开支近乎翻番的超大规模数据中心建设周期。即便AI算力需求是真实的长期结构性需求，中间的「库存消化期」（类比2018年）是周期性现象，其触发只需采购节奏边际放缓，而非需求永久消失。\n\n**边缘类型与催化剂时序**\n\n本分析判定核心变体属于**结构性边缘（structural edge）**：A股定价机制系统性低估了96%境外集中度在地缘政治尾部情景下的非线性损失函数。这不是信息获取的偏差（双方均能看到同样的集中度数字），而是A股机构研报以增速兑现为核心建模框架的结构性局限——地缘政治尾部情景的显式概率赋值被系统性压缩，不构成主流模型输入。\n\n最近期催化剂（3天内）：半年报完整披露，核心关注前五大客户集中度（是否继续向97.9%+推进）与H1 2026实际营收。若境外集中度进一步上升，地缘政治敞口在扩大而非收窄，变体论点将获结构性强化而非弱化。H2 2026三季报（2026-10-31）是第一个业绩兑现硬信号窗口，¥100亿为关键观察门槛。", "fallback": false}, {"role": "宏观分析师", "name": "行业周期与政策环境", "stance": "neutral", "score": 3.4, "thesis": "公司43.7%运营利润率与86.6% ROIC的可持续性更可能源于AI算力军备竞赛下光互联供需极度紧张赋予的阶段性定价溢价，而非研发驱动的深层技术护城河——研发费用¥7.0亿的绝对量难以支撑建立系统性专利壁垒，叠加光模块行业整体技术门槛正随产能扩张而降低；一旦竞争对手（含国内外同类厂商）产能追上，利润率面临向行业均值区间收敛的结构性下行压力。", "pros": ["公司运营利润率43.7%与ROIC 86.6%均大幅超越光通信硬件行业一线厂商通常20-35%运营利润率、15-30% ROIC的健康区间，属行业中的异常高位，指标组合在全球同类公司中极为罕见。", "研发费用¥7.0亿相对于¥248.4亿总营收处于极低水平，而信息技术-通信设备行业典型研发投入强度通常在8-15%区间，公司的研发绝对量与营收规模严重不匹配，提示商业模式更偏向高端组装集成而非深层专利技术研发。"], "cons": ["光模块行业在特定代际（800G/1.6T）存在认证锁定（设计定点）效应：一旦进入超大规模数据中心客户的供应链BOM，切换验证周期通常长达12-18个月，工艺良率与交付稳定性构成实质性进入壁垒。2.8%的表观研发强度不能否定制造工艺深度形成的隐性护城河，前五大客户72.34%的长期粘性本身是产品竞争力", "若2026E一致预期EPS ¥17.09元兑现，当前股价对应的前向估值将大幅低于TTM水平，且TTM市盈率43.5倍本已低于光通信板块中位数114.1倍（处第20分位）；在机构17家覆盖、最新研报2026-08-26的密集跟踪下，高预期本身意味着专业买方已对竞争格局与供需周期进行了充分评估，当前估值"], "narrative": "", "fallback": false}], "agentsFootnote": "前瞻市盈率口径注：一致预期 EPS 隐含股本约 11.6亿股（归母预测/EPS），与当前总股本约 13.9亿股（市值/现价）相差约 17%。按 现价/EPS 口径前瞻 PE 2026E≈23.9×、2027E≈14.1×；按 市值/归母 口径 2026E≈28.9×、2027E≈17.1×。正文不同分析师引用的两组前瞻倍数均有据，差异纯系股本基准不同。", "critics": [{"name": "逻辑批评员", "issues": 0}, {"name": "财务批评员", "issues": 4}, {"name": "证据批评员", "issues": 0}, {"name": "行业批评员", "issues": 0}, {"name": "认知偏差批评员", "issues": 0}, {"name": "宏观一致性批评员", "issues": 0}, {"name": "市场批评员", "issues": 1}, {"name": "数值一致性批评员", "issues": 0}, {"name": "叙述事实核查员", "issues": 9}, {"name": "LLM 数值审核员", "issues": 0}], "thesis": {"core": "现价¥409.10（市值¥5703亿）所提出的核心命题是：新易盛43.7%的运营利润率与86.6%的ROIC，究竟是工程良率、客户认证壁垒与交付速度构成的结构性护城河（可在2027-2028年竞争格局重塑后持续），还是AI算力军备竞赛下供需极度紧张赋予的阶段性定价溢价（将随竞争对手产能爬坡而系统性收窄）？\n\n偏多假设认为：超大规模数据中心客户12-18个月的认证锁定窗口，叠加99.7%单一光互联产品的交付稳定性背书，足以支撑机构归母净利润¥197.57亿/¥334.22亿（2026E/2027E）路径；2026E前瞻市盈率约〔未经核准的数字已略去〕、2027E约〔未经核准的数字已略去〕将随利润翻倍自动压缩至合理区间；H1 2026光互联产品毛利率48.5%较FY2025全年47.8%的边际改善，是迄今对「纯周期溢价」论点最直接的反驳。\n\n偏空假设认为：2.8%研发密度暴露了技术壁垒的浅层性（专利资产仅¥1.9亿），96%境外集中度叠加72.34%大客户集中度构成双重脆弱结构，任何利润率系统性下滑（无论源于竞争侵蚀或地缘政治冲击）将触发「利润率压缩×倍数压缩」双重非线性释放；概率加权DCF价值¥154.49与现价¥409.10之间的〔未经核准的数字已略去〕缺口安全边际极薄，约67%的FCF/归母净利转化率（经营现金流扣资本开支口径）被净利润定价框架系统性忽视。当前两个假说均有数据支撑，本框架作为监控性工具而非方向性结论使用。", "variant": "区分两个假说的判别性测试聚焦于三个近端可观测数据点，每一个均可在单一报告中提供高信息含量的区分信号：\n\n第一，H1 2026半年报（2026-08-25已披露，全文数据待提取）中光互联产品实际营业利润率——若相对FY2025全年43.7%改善而非收窄，支持结构性壁垒假说；若跌破42%，周期性溢价假说获数据支撑。注意：当前已知毛利率为48.5%，但营业利润率（扣除三费）的具体数字是本框架最高优先级提取目标。\n\n第二，2026年限制性股票激励计划（2026-08-21草案）的具体业绩考核门槛——若归母净利润考核门槛接近或超过机构预期¥197.57亿，管理层内部置信度与市场对齐；若门槛低于¥170亿，直接证明管理层私下持保守态度，增长能见度的核心前提被动摇。\n\n第三，FY2026三季报（2026-10-31披露）归母净利润累计值——机构全年预期¥197.57亿减H1中值¥75亿，H2隐含贡献¥122.57亿；若三季报前三季度累计值低于¥145亿（隐含H2全年低于¥100亿门槛），则机构增长路径在最近期数据中正式断档，两个假说的证伪方向由此确定。", "whyNow": "三个近端事件的密集排列使当前是建立系统性监控框架的最高效时机。第一，2026年半年报已于2026-08-25完整披露，关键补充数字（H1营业利润率、前五大客户集中度、应收账款账龄结构）可从半年报全文中直接提取，是当前最优先的信息闭合动作；第二，2026年限制性股票激励计划草案（2026-08-21披露）的考核门槛数字——这是管理层对FY2026-2027增长路径最具约束力的硬性公开承诺，在股东大会（2026-08-21已公告召开第三次临时股东会）审议通过后将成为正式文件，是关闭「增长能见度」这一最大信息缺口的事件性节点；第三，FY2026三季报（2026-10-31，约63天后）将是H2归母净利润兑现能力的首个硬性校验，¥100亿为关键观察门槛。三个节点在63天内依次落地，使当前正处于「信息密集释放窗口前」的最佳框架建立时间——此后每一份公告均可将当前条件化观察升级为有数据支撑的方向性判断。", "marketStory": "市场当前采用成长定价框架（定价权重42%居主导），核心逻辑是：若光互联产品营业利润率维持43.7%，现价¥409.10需要约+20.7%的年营收增速持续支撑（WACC±1%区间：+18.0%~+23.2%）；而机构一致预期的近端路径（2026E +110%/2027E +70%）远超此永续门槛，意味着成长溢价将随利润翻倍快速自动化解——2026E前瞻市盈率约〔未经核准的数字已略去〕、2027E约〔未经核准的数字已略去〕，在全球AI算力基础设施赛道并非极端定价。市场定价的隐含逻辑链是：近端超高增速作为永续增速的「透支缓冲」，使得终态20.7%增速需求实际上远低于近端实际增速，倍数压缩路径清晰可见；17家机构覆盖且最新研报日期2026-08-26，意味着这一逻辑已经过专业买方的充分评估，地缘政治风险被视为已知但可管控的尾部情景而非基础情景赋值。TTM〔未经核准的数字已略去〕处于同业第20分位（同业中位数〔未经核准的数字已略去〕）的相对折价，进一步支撑了市场「已对新易盛执行风险定价」的自我叙事。偏空假设认为这构成了「系统性定价盲区」：96%境外集中度在地缘政治冲击下的非线性损失函数，在成长框架的建模假设中被接近零赋值。", "divergence": "市场对「地缘政治尾部情景触发概率」的赋值接近于零，而我们认为96%境外收入、72.34%大客户集中度、99.7%单一产品的三重叠加，使任意单一政策性冲击（上游组件出口管制或下游买家采购禁令）均可在单季度内产生接近全额营收的冲击：境内¥9.5亿营收（FY2025，仅占境外的3.97%）几乎提供零对冲缓冲，而A股成长定价框架在建模上系统性地将此类政治性尾部概率压缩至不进入基础情景，形成定价机制层面的结构性盲区，而非个别机构的判断失误。", "counter": "对偏空倾向最有力的反驳：17家机构在充分知情H1预告（¥70-80亿同比翻倍）后仍维持FY2026E归母净利润¥197.57亿的预测（最新研报2026-08-26），对应现价约〔未经核准的数字已略去〕前瞻市盈率——对全球AI算力核心受益、ROIC 86.6%、零有息负债、连续三年超预期兑现的硬件平台而言，这一倍数在可比全球标的中并不极端。TTM〔未经核准的数字已略去〕已处同业第20分位（中位数〔未经核准的数字已略去〕），意味着市场实际上已对新易盛的集中度风险执行了相对折价，「绝对估值高估」与「相对估值折价」的同时成立，更可能源于DCF框架对超常增速期权价值的结构性欠捕获，而非市场非理性；光互联12-18个月的客户认证锁定窗口是可量化的真实壁垒，已通过前五大客户72.34%的长期粘性数据背书；最关键的近端证据：H1 2026光互联产品毛利率48.5%较FY2025全年47.8%边际改善，是迄今对「利润率将立即系统性收窄」最直接的实证反驳——当前空头论点仍是预期而非事实。"}, "sensitivity": {"paragraphs": ["下表为每个单因子 ±1σ 冲击对基准每股价值的弹性。"], "rows": [8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0], "cols": [2.0, 2.5, 3.0, 3.5, 4.0], "matrix": [[184.51, 194.99, 207.56, 222.92, 242.12], [169.88, 178.38, 188.43, 200.49, 215.22], [157.36, 164.36, 172.51, 182.15, 193.72], [146.53, 152.35, 159.06, 166.89, 176.14], [137.08, 141.96, 147.54, 153.98, 161.49], [128.75, 132.89, 137.57, 142.93, 149.11], [121.36, 124.89, 128.86, 133.37, 138.51]], "baseValue": 159.05828641965363, "footnote": "红色表示高于基准（更乐观），绿色反之。"}, "driverSensitivity": [{"k": "加权资本成本 WACC", "delta": -12.9, "shock": 139}, {"k": "营业利润率", "delta": 9.8, "shock": 175}, {"k": "收入增速", "delta": 6.1, "shock": 169}, {"k": "永续增长率", "delta": 2.9, "shock": 164}, {"k": "有效税率", "delta": -1.4, "shock": 157}, {"k": "资本开支 / 营收", "delta": -0.3, "shock": 159}], "monitoring": {"kills": [{"description": "FY2026H2归母净利润兑现失败——机构全年预期¥197.57亿减H1预告中值¥75亿，H2隐含贡献¥122.57亿；若三季报数据隐含H2全年低于此门槛，增长路径在最近期数据中正式断档", "threshold": "H2 2026归母净利润低于¥100亿（较机构隐含¥122.57亿偏低约18%）", "frequency": "年度"}, {"description": "光互联产品营业利润率系统性下台阶——连续两个报告期低于此门槛，定价权侵蚀已实质穿透认证保护期，「结构性壁垒」叙事的核心数字支撑被移除", "threshold": "任意连续两个半年报营业利润率低于40%（较当前43.7%基准下行超3.7pp）", "frequency": "年度"}, {"description": "管理层激励计划考核门槛显著低于市场预期——直接证明管理层内部预期远比市场保守，「高增长能见度」前提失效；考核门槛为唯一具有约束力的内部公开承诺", "threshold": "2026年激励计划正式文件归母净利润考核门槛低于¥170亿（机构一致预期¥19   "sec-monitoring":  () => REPORT.monitoring && (REPORT.monitoring.kills?.length || REPORT.monitoring.monitorables?.length),
  "sec-conclusion":  () => REPORT.conclusion && REPORT.conclusion.paragraphs?.length,
};

  const guard = _SECTION_DATA_GUARD[s.id];
  return guard ? guard() : true;
});

const pct = (n, d = 1) => `${n > 0 ? "+" : ""}${n.toFixed(d)}%`;
// AUDIT (2026-07): REPORT.price.last can legitimately be 0 (all quote
// sources down, or a stale replay cache without market data) — dividing
// by it rendered an unbounded "∞%" in the scenario cards / rating spread /
// valuation gap. The server-side inf/nan sanitizer (BUG-Y39) can't catch
// these because they're computed in the browser. Guard every px/base
// ratio through these helpers: base <= 0 → null / "—" (fmtNum's n/m
// semantics).
const safePctNum = (px, base) =>
  (typeof px === "number" && typeof base === "number" && base > 0 && Number.isFinite(px))
    ? ((px / base) - 1) * 100 : null;
const safePct = (px, base, d = 1, signed = false) => {
  const v = safePctNum(px, base);
  return v === null ? "—" : `${signed && v > 0 ? "+" : ""}${v.toFixed(d)}%`;
};
const fmtNum = (n, digits = 2) =>
  (n === null || n === undefined || (typeof n === "number" && !Number.isFinite(n)))
    ? "n/m"
    : n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtPx = (n) => `${CURR()}${fmtNum(n, n < 100 ? 2 : 2)}`;

function RightRail() {
  const rail = REPORT.rail || {};
  const priceHistory = rail.priceHistory || [REPORT.price.last];
  const max = Math.max(...priceHistory), min = Math.min(...priceHistory);
  const chg = REPORT.price.change;
  const chgPct = REPORT.price.changePct;
  const hasChange = (chg !== 0 || chgPct !== 0);
  const up = chg > 0;
  // Prefer trend color when we have a real multi-point history (first vs last).
  // Fall back to intraday-change color, then neutral.
  const trendUp = priceHistory.length >= 2
    ? priceHistory[priceHistory.length - 1] > priceHistory[0]
    : null;
  const sparkColor = trendUp === null
    ? (hasChange ? (up ? "var(--up)" : "var(--down)") : "var(--text-3)")
    : (trendUp ? "var(--up)" : "var(--down)");
  const pts = priceHistory.map((p, i) => [i / Math.max(1, priceHistory.length - 1) * 100, (1 - (p - min) / Math.max(0.0001, max - min)) * 100]);
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]} ${p[1]}`).join(" ");

  return (
    <aside className="rail">
      <div className="rail-block">
        <div className="lbl">{L("实时行情", "Live quote")}</div>
        <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between", marginBottom: 4}}>
          <span className="mono" style={{fontSize: 22, color:"var(--text)"}}>{CURR()}{fmtNum(REPORT.price.last)}</span>
          {hasChange && (
            <span className="mono" style={{fontSize: 12, color: up ? "var(--up)" : "var(--down)"}}>
              {up ? "+" : ""}{chg.toFixed(2)} {up ? "+" : ""}{chgPct.toFixed(2)}%
            </span>
          )}
        </div>
        <div style={{fontSize: 11.5, color:"var(--text-4)", fontFamily:"var(--mono)", marginBottom: 10}}>{REPORT.price.asOf || "—"} · {L("延迟", "Delay")} &lt;3s</div>
        <svg viewBox="0 0 100 36" preserveAspectRatio="none" style={{width:"100%", height: 52}}>
          <defs>
            <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={sparkColor} stopOpacity="0.28"/>
              <stop offset="100%" stopColor={sparkColor} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <path d={`${pathD} L 100 36 L 0 36 Z`} fill="url(#spark)"/>
          <path d={pathD} fill="none" stroke={sparkColor} strokeWidth="0.9"/>
        </svg>
        {(rail.marketKvs || []).map(kv => (
          <div className="rail-kv" key={kv.k}>
            <span className="k">{kv.k}</span>
            <span className={`v ${kv.tone || ""}`}>{kv.v}</span>
          </div>
        ))}
      </div>

      <div className="rail-block">
        <div className="lbl">{L("批评审核委员会", "Critic review panel")}</div>
        {REPORT.critics.map(c => {
          const dot = c.issues === 0 ? "ok" : c.issues <= 1 ? "warn" : "err";
          return (
            <div className="critic-row" key={c.name}>
              <span className={`dot ${dot}`}></span>
              <span className="cn">{c.name}</span>
              <span className="cc">{c.issues === 0 ? L("通过", "Pass") : `${c.issues} ${L("项", "issues")}`}</span>
            </div>
          );
        })}
        {rail.biasStatus && (
          <div style={{fontSize: 11, color: "var(--text-4)", fontFamily:"var(--mono)", marginTop: 8}}>{L("总体偏差检查", "Bias check")} · {rail.biasStatus}</div>
        )}
      </div>

      {(rail.openQuestions && rail.openQuestions.length > 0) && (
        <div className="rail-block">
          <div className="lbl">{L("待研究缺口", "Open questions")} · {L("前", "top")} {rail.openQuestions.length}</div>

function Verdict() {
  const wordClass = REPORT.rating.tone;
  // 审计处方一 1（2026-08-28）：观察框架票抑制卖方包装——评级卡位标
  // 「产品形态」，目标价卡位由数据侧改标「DCF 参照系 · 非目标价」，
  // 差额卡位改中性措辞，期限/风险等级卡位整体隐藏。
  const isObs = !!(REPORT.rating && REPORT.rating.observationFramework);
  // When DCF is n/m the target is null — guard the implied-return math so
  // we render a dash instead of crashing on `null / number`.
  const _hasTarget = (typeof REPORT.rating.target === "number") && Number.isFinite(REPORT.rating.target);
  // safePctNum guards price.last <= 0 (dead quote sources) → "—" not "∞%".
  const spread = _hasTarget ? safePctNum(REPORT.rating.target, REPORT.price.last) : null;
  const spreadColor = (spread !== null && spread >= 0) ? "var(--up)" : "var(--down)";
  return (
    <div className="verdict">
      <div className="rating">
        <span className="tag">{isObs ? L("产品形态", "Form") : L("评级", "Rating")}</span>
        <span className={`word ${wordClass}`}>{REPORT.rating.word}</span>
      </div>
      <div style={{display:"flex", gap: 36, flexWrap:"wrap", alignItems:"center"}}>
        <div className="tgt">
          <span className="lbl">{isObs
            ? (REPORT.rating.weighted || L("DCF 参照系 · 非目标价", "DCF reference frame · not a target"))
            : <>{L("目标价", "Target")} · {REPORT.rating.weighted || L("概率加权", "Probability-weighted")}</>}</span>
          <span className="val">{_hasTarget ? `${CURR()}${fmtNum(REPORT.rating.target)}` : "n/m"}</span>
        </div>
        <div className="tgt">
          <span className="lbl">{isObs ? L("参照系 vs 现价差额", "Reference vs price gap") : L("隐含回报", "Implied return")}</span>
          <span className="val" style={{color: spreadColor}}>
            {spread === null ? "—" : `${spread > 0 ? "+" : ""}${spread.toFixed(1)}%`}
          </span>
        </div>
        {!isObs && (
          <div className="tgt">
            <span className="lbl">{L("时间跨度", "Time horizon")}</span>
            <span className="val">{REPORT.rating.timeHorizon || L("12 个月", "12 months")}</span>
          </div>
        )}
        {!isObs && (
          <div className="tgt">
            <span className="lbl">{L("风险等级", "Risk level")}</span>
            <span className="val">{REPORT.rating.riskLevel || L("中", "Medium")}</span>
          </div>
        )}
      </div>
    </div>
  );
}

function Financials() {
  const f = REPORT.financials;
  if (!f) return null;
  const rev = f.revHistory || [];
  // Y-axis baseline: when the series is tightly clustered (min/max > 0.5,
  // e.g. mature companies like AAPL where revenue varies within a narrow
  // band), a zero-based axis crushes all bars to roughly equal heights.
  // Use a compressed baseline padded 25 % below min so relative differences
  // are legible. For wide-range hockey-stick series (NVDA, 301358) keep
  // the zero baseline.
  const values = rev.map(r => r.v);
  const maxV = values.length ? Math.max(...values) : 1;
  const minV = values.length ? Math.min(...values) : 0;
  const useCompressed = maxV > 0 && minV / maxV > 0.5;
  const baseline = useCompressed ? Math.max(0, minV - 0.25 * (maxV - minV)) : 0;
  const span = (maxV - baseline) || 1;

  return (
    <section id="sec-financial">
      <SectionHead idx={L("05 · 财务解剖", "05 · Financial dissection")} title={f.title || L("财务解剖", "Financial dissection")} subtitle={f.subtitle}/>
      {(f.paragraphs && f.paragraphs.length > 0) && (
        <div className="reading wide prose">
          {f.paragraphs.map((html, i) => (
            <p key={i} dangerouslySetInnerHTML={{__html: html}}/>
          ))}
        </div>
      )}

      <div style={{display:"grid", gridTemplateColumns: rev.length > 0 ? "1.4fr 1fr" : "1fr", gap: 24, marginTop: 24, alignItems: "start"}}>
        {rev.length > 0 && (
          <div style={{padding: "24px 24px 28px", background: "var(--bg-elev)", border: "1px solid var(--hairline)", borderRadius: 8}}>
            <div className="eyebrow" style={{marginBottom: 18}}>{f.revTitle || L("年度营收", "Annual revenue")}</div>
            <div style={{display:"flex", alignItems:"flex-end", gap: 14, height: 180, borderBottom: "1px solid var(--hairline)", paddingBottom: 8}}>
              {rev.map(r => {
                const h = Math.max(2, (r.v - baseline) / span * 100);
                const highlight = r.y === f.revHighlightYear;
                return (
                  <div key={r.y} style={{flex: 1, height: "100%", display:"flex", flexDirection: "column", justifyContent: "flex-end", alignItems:"center", gap: 6}}>
                    <span style={{fontFamily:"var(--mono)", fontSize: 11, color: "var(--text-3)"}}>{r.v}</span>
                    <div style={{width: "100%", height: `${h}%`, background: highlight ? "var(--accent-bg)" : "var(--surface-2)", borderTop: `1px solid ${highlight ? "var(--accent)" : "var(--hairline-strong)"}`, borderRadius: "2px 2px 0 0"}}/>
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex", gap: 14, marginTop: 6}}>
              {rev.map(r => <div key={r.y} style={{flex: 1, textAlign:"center", fontFamily:"var(--mono)", fontSize: 11, color: "var(--text-4)"}}>{r.y}</div>)}
            </div>
            {f.revFootnote && <p className="footnote" style={{marginTop: 14}}>{f.revFootnote}</p>}
          </div>
        )}

        {(f.kpis && f.kpis.length > 0) && (
          <div style={{padding: "18px 22px", background: "var(--bg-elev)", border: "1px solid var(--hairline)", borderRadius: 8}}>
            <div className="eyebrow" style={{marginBottom: 10}}>{f.kpisTitle || L("关键指标", "Key metrics")}</div>
            <table className="data">
              <tbody>
                {f.kpis.map((k, i) => {
                  const toneStyle = k.tone === "down" ? {color: "var(--down)"} : k.tone === "up" ? {color: "var(--up)"} : {};
                  return (
                    <tr key={i} className={k.total ? "total" : ""}>
                      <td style={k.tone ? {color:"var(--text-2)"} : {}}>{k.label}</td>
                      <td className="num" style={toneStyle}>{k.value}</td>
                    </tr>
                  );
                })}
              </tbody>

        )}

      {f.calloutHtml && (
        <div className="callout" style={{marginTop: 24}} dangerouslySetInnerHTML={{__html: f.calloutHtml}}/>

  );

                <ul>{(a.cons || []).map((p, j) => <li key={j}>{p}</li>)}</ul>
              </div>
            </div>
            {/* BUG-Y29: deep-mode agents emit a free-form narrative
                supplement (~1500-2800 chars) BEYOND the structured thesis +
                pros/cons. Surface it as a collapsible block so readers who
                want the full reasoning can expand it. */}
            {a.narrative && a.narrative.length > 80 && (
              <details className="agent-narrative" style={{
                marginTop: 12,
                paddingTop: 12,
                borderTop: "1px dashed var(--hairline)",
              }}>
                <summary style={{
                  cursor: "pointer",
                  fontFamily: "var(--mono)",
                  fontSize: 11,
                  letterSpacing: "0.06em",
                  textTransform: "uppercase",
                  color: "var(--text-3)",
                }}>
                  {L("深度分析（展开）", "Deep analysis (expand)")} · {a.narrative.length} {L("字符", "chars")}
                </summary>
                <div className="prose" style={{marginTop: 10, whiteSpace: "pre-wrap"}}>
                  {a.narrative}
                </div>
              </details>
            )}
          </div>
        ))}
      </div>
      {REPORT.agentsFootnote && (
        <div className="mono" style={{marginTop: 18, fontSize: 12, color: "var(--text-3)", background: "var(--bg-elev)", border: "1px solid var(--hairline)", borderRadius: 6, padding: "10px 14px", lineHeight: 1.7}}>
          {REPORT.agentsFootnote}
        </div>
      )}
    </section>
  );
}

function SensitivitySection() {
  const s = REPORT.sensitivity;
  if (!s) return null;
  const flat = (s.matrix || []).flat();
  const hi = Math.max(...flat, 1), lo = Math.min(...flat, 0);
  const base = s.baseValue || (REPORT.dcf && REPORT.dcf.summary ? REPORT.dcf.summary.perShare : 0);
  const curr = CURR();

  const heatColor = (v) => {
    if (v >= base) {
      const k = Math.min(1, (v - base) / Math.max(0.0001, hi - base));
      return `color-mix(in oklab, var(--up) ${Math.round(k*42)}%, transparent)`;
    } else {
      const k = Math.min(1, (base - v) / Math.max(0.0001, base - lo));
      return `color-mix(in oklab, var(--down) ${Math.round(k*42)}%, transparent)`;
    }
  };

  return (
    <section id="sec-sensitivity">
      <SectionHead idx={L("08 · 敏感性", "08 · Sensitivity")} title={L("驱动因子弹性与 WACC × g 热力矩阵", "Driver elasticities & WACC × g heat-map")} subtitle={L("敏感性分析器", "Sensitivity Analyzer")}/>
      {(s.paragraphs || []).length > 0 && (
        <div className="reading wide prose">
          {s.paragraphs.map((html, i) => (
            <p key={i} dangerouslySetInnerHTML={{__html: html}}/>
          ))}
        </div>
      )}

      {(REPORT.driverSensitivity && REPORT.driverSensitivity.length > 0) && (
        <div style={{padding: "22px 24px", background: "var(--bg-elev)", border:"1px solid var(--hairline)", borderRadius: 8, marginTop: 20}}>
          <div className="eyebrow" style={{marginBottom: 14}}>{s.driverTitle || (isCN() ? `驱动因子弹性（冲击后每股值 vs 基准 ${curr}${base.toFixed(2)}）` : `Driver elasticity (per-share value after shock vs base ${curr}${base.toFixed(2)})`)}</div>
          <div className="barlist">
            {REPORT.driverSensitivity.map(d => {
              const w = Math.min(25, Math.abs(d.delta)) / 25 * 50;
              const pos = d.delta >= 0;
              return (
                <div className="barlist-row" key={d.k}>
                  <span className="label">{d.k}</span>
                  <div className="track">
                    <div className="midline"/>
                    {pos
                      ? <div className="fill pos" style={{left: "50%", width: `${w}%`}}/>
                      : <div className="fill neg" style={{right: "50%", width: `${w}%`}}/>
                    }
                  </div>
                  <span className={`v ${pos ? "up" : "down"}`}>
                    {pct(d.delta)} · {curr}{d.shock}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {(s.matrix && s.matrix.length > 0) && (
        <div style={{marginTop: 28}}>
          <div className="eyebrow" style={{marginBottom: 12}}>{L("WACC (行) × 永续增长率 g (列) · 每股公允价值", "WACC (rows) × terminal growth g (cols) · per-share fair value")}</div>
          <table className="heat">
            <thead>
              <tr>
                <th></th>
                {s.cols.map(c => <th key={c}>g = {c.toFixed(1)}%</th>)}
              </tr>
            </thead>
            <tbody>
              {s.matrix.map((row, i) => (
                <tr key={i}>
                  <td className="rh">WACC {s.rows[i].toFixed(1)}%</td>
                  {row.map((v, j) => (
                    <td key={j} className="hot" style={{background: heatColor(v), color: "var(--text)"}}>
                      {curr}{v}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
          <p className="footnote">{s.footnote || (isCN() ? `基准每股 ${curr}${base.toFixed(2)}；红色表示高于基准（更乐观），绿色反之。` : `Base per-share ${curr}${base.toFixed(2)}; shading intensity = deviation from base.`)}</p>
        </div>
      )}
    </section>
  );
}

// 审计处方三 2（2026-08-28）：监控合约区块。产品形态横幅承诺「监控点、
// 阈值、证伪触发」，数据侧 decision.kill_criteria / monitorables 此前只
// 落日志——这里渲染 kill 条件表（描述/阈值/检查频率）+ 监控点按来源
// agent 分组列表；anchorNote 为 H2 兑现锚的唯一推导口径（数据侧从
// verification evidence 推导，缺件即 null 隐藏）。
function MonitoringContract() {
  const m = REPORT.monitoring;
  if (!m || !((m.kills || []).length || (m.monitorables || []).length)) return null;
  const kills = m.kills || [];
  const mons = m.monitorables || [];
  // 按来源 agent 分组（保持首次出现顺序）
  const groups = [];
  const byAgent = {};
  mons.forEach(x => {
    const key = x.agent || L("未标注来源", "Unattributed");
    if (!byAgent[key]) { byAgent[key] = []; groups.push(key); }
    byAgent[key].push(x);
  });
  const cellStyle = {background:"var(--bg-elev)", padding:"12px 16px", fontSize:13.5, color:"var(--text-2)"};
  return (
    <section id="sec-monitoring">
      <SectionHead idx={L("09 · 监控合约", "09 · Monitoring contract")}
                   title={L("监控合约", "Monitoring contract")}
                   subtitle={L("证伪触发（Kill 条件）与监控点 · 决策引擎结构化输出", "Kill criteria & monitorables · structured decision output")}/>
      {m.anchorNote && (
        <div className="mono" style={{fontSize:12.5, color:"var(--text-2)", background:"var(--accent-bg)", border:"1px solid var(--hairline)", borderRadius:6, padding:"10px 14px", marginBottom:12}}>
          {m.anchorNote}
        </div>
      )}
      {m.incentiveNote && (
        <div className="mono" style={{fontSize:12.5, color:"var(--text-2)", background:"var(--accent-bg)", border:"1px solid var(--hairline)", borderRadius:6, padding:"10px 14px", marginBottom:18}}>
          {m.incentiveNote}
        </div>
      )}
      {kills.length > 0 && (
        <div style={{marginBottom:28}}>
          <div className="eyebrow" style={{marginBottom:10}}>
            {L(`证伪触发 · Kill 条件（${kills.length}）`, `Kill criteria (${kills.length})`)}
          </div>
          {m.killsNote && (
            <div style={{fontSize:12.5, color:"var(--text-3)", margin:"0 0 10px", lineHeight:1.7}}>
              {m.killsNote}
            </div>
          )}
          <div style={{display:"grid", gridTemplateColumns:"minmax(0,1.6fr) minmax(0,1fr) 92px", gap:1, background:"var(--hairline)", border:"1px solid var(--hairline)", borderRadius:8, overflow:"hidden"}}>
            <div style={{...cellStyle, fontFamily:"var(--mono)", fontSize:11, color:"var(--text-3)", letterSpacing:"0.06em"}}>{L("描述", "Description")}</div>
            <div style={{...cellStyle, fontFamily:"var(--mono)", fontSize:11, color:"var(--text-3)", letterSpacing:"0.06em"}}>{L("触发阈值", "Threshold")}</div>
            <div style={{...cellStyle, fontFamily:"var(--mono)", fontSize:11, color:"var(--text-3)", letterSpacing:"0.06em"}}>{L("频率", "Cadence")}</div>
            {kills.map((k, i) => (
              <React.Fragment key={i}>
                <div style={cellStyle}>{k.description}</div>
                <div style={{...cellStyle, color:"var(--text)"}}>{k.threshold || "—"}</div>
                <div style={{...cellStyle, fontFamily:"var(--mono)", fontSize:12, color:"var(--text-3)"}}>{k.frequency || "—"}</div>
              </React.Fragment>
            ))}
          </div>
        </div>
      )}
      {mons.length > 0 && (
        <div>
          <div className="eyebrow" style={{marginBottom:10}}>
            {L(`监控点（${mons.length}）· 按来源分组`, `Monitorables (${mons.length}) · by source`)}
          </div>
          {groups.map(g => (
            <div key={g} style={{marginBottom:16}}>
              <div style={{fontFamily:"var(--mono)", fontSize:11.5, color:"var(--text-3)", letterSpacing:"0.05em", margin:"10px 0 6px"}}>
                {g} · {byAgent[g].length}
              </div>
              <ul style={{margin:0, paddingLeft:18}}>
                {byAgent[g].map((x, i) => (
                  <li key={i} style={{fontSize:13.5, color:"var(--text-2)", margin:"4px 0"}}>
                    {x.description}
                    {x.frequency ? <span className="mono" style={{fontSize:11, color:"var(--text-4)"}}> · {x.frequency}</span> : null}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      )}
    </section>
  );
}

function Conclusion() {
  const c = REPORT.conclusion || {};
  return (
    <section id="sec-conclusion">
      <SectionHead idx={L("10 · 结论", "10 · Conclusion")} title={c.title || L("结论", "Conclusion")} subtitle={c.subtitle || L("首席分析师 · 终稿", "Chief Analyst · Final")}/>
      {(c.paragraphs && c.paragraphs.length > 0) && (
        <div className="reading wide prose">
          {c.paragraphs.map((html, i) => (
            <p key={i} dangerouslySetInnerHTML={{__html: html}}/>
          ))}
        </div>
      )}

      {(REPORT.catalysts && REPORT.catalysts.length > 0) && (
        <div style={{marginTop: 40}}>
          <div className="eyebrow" style={{marginBottom: 14}}>{c.catalystsTitle || L("未来催化剂", "Upcoming catalysts")}</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr", gap: 1, background:"var(--hairline)", border:"1px solid var(--hairline)", borderRadius: 8, overflow:"hidden"}}>
            {REPORT.catalysts.map(ev => {
              const impactColor = (ev.impact === "高" || ev.impact === "High") ? "var(--up)" : "var(--warn)";
              const impactBg = (ev.impact === "高" || ev.impact === "High") ? "var(--up-soft)" : "var(--warn-soft)";
              return (
                <div key={ev.date + ev.title} style={{background:"var(--bg-elev)", padding: "16px 22px", display:"grid", gridTemplateColumns:"130px 1fr auto", gap: 24, alignItems:"center"}}>
                  <div className="mono" style={{color:"var(--text-3)", fontSize: 13}}>{ev.date}</div>
                  <div>
                    <div style={{fontFamily:"var(--serif)", fontSize: 16, color:"var(--text)", marginBottom: 2}}>{ev.title}</div>
                    <div style={{fontSize: 12.5, color:"var(--text-3)"}}>{ev.note}</div>
                  </div>
                  <div className="mono" style={{fontSize: 11, color: impactColor, padding: "3px 9px", background: impactBg, borderRadius: 3, letterSpacing: "0.06em"}}>
                    {L("影响", "Impact")} · {ev.impact}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{marginTop: 56, paddingTop: 28, borderTop: "1px solid var(--hairline)", display:"flex", justifyContent:"space-between", gap: 20, fontFamily:"var(--mono)", fontSize: 11.5, color: "var(--text-4)", flexWrap:"wrap"}}>
        <span>Aegis · {L("投研 OS", "Research OS")} · v0.9.3</span>
        <span>{L("生成于", "Generated on")} {REPORT.reportDate}</span>
        <span>{L("Pipeline: 数据抓取 → 归一化 → DCF → 7 Agent → Critic → 合成 → 编辑", "Pipeline: Fetch → Normalize → DCF → 7 Agents → Critics → Synthesize → Edit")}</span>
        <span>{L("本报告不构成投资建议", "Not investment advice")}</span>
      </div>
    </section>
  );
}

function Dock({ onToggleTweaks }) {
  // Kick off a fresh pipeline run for this ticker via the local server.
  // Falls back to alert + no-op when the page is opened from file:// and
  // no server is reachable.
  const onRegenerate = async () => {
    const ticker = (REPORT.code || "").toString();
    if (!ticker) return;
    try {
      const r = await fetch("/api/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ticker}),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const state = await r.json();
      window.location.href = `/progress?run_id=${encodeURIComponent(state.run_id)}&ticker=${encodeURIComponent(ticker)}`;
    } catch (e) {
      alert(L(`无法启动重新生成：${e.message}。请确认本地服务已启动。`,
              `Unable to start regeneration: ${e.message}. Local server must be running.`));
    }
  };
  const onShare = async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      // Minimal feedback via button title toggle (avoid heavy toast UI)
      const btn = event?.currentTarget;
      if (btn) { const old = btn.title; btn.title = L("已复制链接", "Link copied"); setTimeout(() => { btn.title = old; }, 1500); }
    } catch {
      alert(L("复制失败，请手动复制浏览器地址栏", "Copy failed; please copy the URL manually"));
    }
  };
  return (
    <div className="dock">
      <button onClick={onRegenerate} title={L("重新生成报告", "Regenerate")}><Icon path="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>{L("重新生成", "Regenerate")}</button>
      <button onClick={onShare} title={L("分享", "Share")}><Icon path="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7 M16 6l-4-4-4 4 M12 2v14"/>{L("分享", "Share")}</button>
      <button onClick={onToggleTweaks} title="Tweaks"><Icon path="M3 6h18 M3 12h18 M3 18h18 M7 3v6 M12 9v6 M17 15v6"/>Tweaks</button>
      <button className="primary" title={L("导出 PDF", "Export PDF")} onClick={() => window.print()}><Icon path="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 14l3 3 3-3 M12 17V9"/>{L("导出 PDF", "Export PDF")}</button>
    </div>
  );
}
function Icon({ path }) {
  return <svg viewBox="0 0 24 24"><path d={path}/></svg>;
}

function TweaksPanel({ state, setState, on }) {
  const hues = [210, 175, 260, 45, 0];
  return (
    <div className={`tweaks ${on ? "on" : ""}`}>
      <h4>Tweaks</h4>
      <div className="tweak-row">
        <span>{L("强调色", "Accent")}</span>
        <div className="swatches">
          {hues.map(h => (
            <div key={h} className={`swatch ${state.accentHue === h ? "on" : ""}`}
                 style={{background: `oklch(0.72 0.075 ${h})`}}
                 onClick={() => setState({...state, accentHue: h})}/>
          ))}
        </div>
      </div>
      <div className="tweak-row">
        <span>{L("正文宽度", "Reading width")}</span>
        <div className="seg-ctl">
          {["tight", "comfortable", "wide"].map(w => (
            <button key={w} className={state.readingWidth === w ? "on" : ""}
                    onClick={() => setState({...state, readingWidth: w})}>
              {w === "tight" ? L("紧凑", "Tight") : w === "comfortable" ? L("舒适", "Comfortable") : L("宽松", "Wide")}
            </button>
          ))}
        </div>
      </div>
      <div className="tweak-row">
        <span>{L("右侧信息栏", "Right rail")}</span>
        <div className="seg-ctl">
          <button className={state.showRail ? "on" : ""} onClick={() => setState({...state, showRail: true})}>{L("显示", "Show")}</button>
          <button className={!state.showRail ? "on" : ""} onClick={() => setState({...state, showRail: false})}>{L("隐藏", "Hide")}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState("sec-summary");
  const [tweakState, setTweakState] = useState(typeof TWEAK_DEFAULTS !== "undefined" ? TWEAK_DEFAULTS : {accentHue: 210, readingWidth: "comfortable", showRail: false});
  const [tweaksVisible, setTweaksVisible] = useState(false);

  // Drive market-specific color semantics (涨跌颜色) from CSS.
  // US/global defaults: green = up, red = down. A-share flips them.
  useEffect(() => {
    document.body.dataset.market = isCN() ? "CN" : "US";
  }, []);

  useEffect(() => {
    const onScroll = () => {
      const p = document.getElementById("scroll-progress");
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      if (p) p.style.width = `${pct}%`;

      const pos = window.scrollY + 140;
      let cur = SECTIONS[0].id;
      for (const s of SECTIONS) {
        const el = document.getElementById(s.id);
        if (el && el.offsetTop <= pos) cur = s.id;
      }
      setActive(cur);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    document.documentElement.style.setProperty("--accent", `oklch(0.72 0.075 ${tweakState.accentHue})`);
    document.documentElement.style.setProperty("--accent-dim", `oklch(0.52 0.055 ${tweakState.accentHue})`);
    document.documentElement.style.setProperty("--accent-bg", `oklch(0.28 0.04 ${tweakState.accentHue} / 0.35)`);
  }, [tweakState]);

  const mainWidthStyle = {
    padding: tweakState.readingWidth === "tight" ? "36px 40px 160px" :
             tweakState.readingWidth === "wide"  ? "36px 72px 160px" : "36px 56px 160px"
  };

  return (
    <>
      <TopBar/>
      <div className="layout" style={{gridTemplateColumns: tweakState.showRail ? "260px minmax(0,1fr) 280px" : "260px minmax(0,1fr)"}}>
        <TableOfContents active={active}/>
        <main className="main" style={mainWidthStyle}>
          <Hero/>
          <ExecutiveSummary/>
          {/* Aegis 2.0 Phase 0：预期前沿第一公民——放在 DCF 情景之前 */}
          <PricedIn/>
          <ValuationBand/>
          <Macro/>
          <Financials/>
          <DcfSection/>
          <AgentsSection/>
          <SensitivitySection/>
          <MonitoringContract/>
          <Conclusion/>
        </main>
        {tweakState.showRail && <RightRail/>}
      </div>
      <Dock onToggleTweaks={() => setTweaksVisible(v => !v)}/>
      <TweaksPanel state={tweakState} setState={setTweakState} on={tweaksVisible}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
