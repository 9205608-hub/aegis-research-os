[project]
name = "aegis-research-os"
version = "0.1.0"
description = "Aegis Research OS - Global Top-Tier Intelligent Investment Research System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
    "typer>=0.9,<1",
    "rich>=13.7,<14",
    "duckdb>=0.10,<1",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "anthropic>=0.40,<1",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "openai>=1.30,<3",
    "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<5",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
